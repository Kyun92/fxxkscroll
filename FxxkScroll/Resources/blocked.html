<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FxxkScroll</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f7eb;
    --dim: #8b9a99;
    --accent: #caff38;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 16px 12px 0;
  }
  pre {
    white-space: pre;
    font-family: Menlo, Consolas, "Liberation Mono", monospace;
    font-weight: 700;
    font-variant-ligatures: none;
    font-kerning: none;
    line-height: 1.25;
    color: var(--fg);
    user-select: none;
  }
  .dim { color: var(--dim); }
  .type { color: var(--accent); }
  footer {
    flex: none;
    text-align: center;
    padding: 12px 24px 40px;
  }
  p {
    font-size: 18px;
    color: var(--dim);
    line-height: 1.5;
  }
  p strong { color: var(--accent); font-weight: 700; }
  button {
    margin-top: 20px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--bg);
    background: var(--fg);
    border: 0;
    border-radius: 999px;
    padding: 13px 28px;
    cursor: pointer;
  }
  button:hover { opacity: 0.88; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
</style>
</head>
<body>
<main class="stage" role="img" aria-label="FXXK SCROLL. STAY FOCUSED.">
  <pre id="art" aria-hidden="true"></pre>
</main>
<footer>
  <p id="message"></p>
  <button id="back" type="button" autofocus></button>
</footer>
<script src="ascii-frames.js"></script>
<script>
  // Message and back button.
  const params = new URLSearchParams(location.search);
  const service = params.get("s") || "web";
  const count = Math.max(1, parseInt(params.get("n") || "1", 10) || 1);
  const ko = (params.get("lang") || navigator.language || "").startsWith("ko");

  const names = {
    youtube: { ko: "쇼츠", en: "Shorts" },
    instagram: { ko: "릴스", en: "Reels" },
    tiktok: { ko: "틱톡", en: "TikTok" },
  };
  const homes = {
    youtube: "https://www.youtube.com/",
    instagram: "https://www.instagram.com/",
  };
  const name = names[service] ? names[service][ko ? "ko" : "en"] : (ko ? "페이지" : "page");

  const message = document.getElementById("message");
  const back = document.getElementById("back");
  if (ko) {
    document.documentElement.lang = "ko";
    message.innerHTML = `오늘 <strong>${count}번째</strong>로 막은 ${name}입니다.`;
    back.textContent = "하던 일로 돌아가기";
  } else {
    message.innerHTML = `${name} blocked. That makes <strong>${count}</strong> today.`;
    back.textContent = "Back to what you were doing";
  }
  document.title = `FxxkScroll (${count})`;

  back.addEventListener("click", () => {
    // History is [page before, blocked page, this page]. Skip the blocked one.
    if (history.length > 2) {
      history.go(-2);
    } else if (homes[service]) {
      location.href = homes[service];
    } else {
      window.close();
    }
  });
</script>
<script>
  // ASCII animation. Frame text plus 2-bit tones (0, 2 plain, 1 dim, 3 accent).
  (() => {
    const data = window.FXXK_ASCII;
    if (!data) return;
    const art = document.getElementById("art");
    const stage = document.querySelector(".stage");
    const motion = matchMedia("(prefers-reduced-motion: reduce)");
    const escape = s => s.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    let total = 0;
    const ends = data.durationsMs.map(ms => (total += ms));
    const cache = new Map();
    let current = -1, timer = 0;
    const origin = performance.now();

    function markup(index) {
      if (cache.has(index)) return cache.get(index);
      const colors = atob(data.tones[index]);
      let output = "", run = "", last = -1, cell = 0;
      const flush = () => {
        if (!run) return;
        const cls = last === 1 ? "dim" : last === 3 ? "type" : "";
        output += cls ? `<span class="${cls}">${escape(run)}</span>` : escape(run);
        run = "";
      };
      for (const ch of data.frames[index]) {
        if (ch === "\n") { run += "\n"; continue; }
        const tone = (colors.charCodeAt(cell >> 2) >> ((cell & 3) * 2)) & 3;
        cell++;
        if (tone !== last) { flush(); last = tone; }
        run += ch;
      }
      flush();
      cache.set(index, output);
      if (cache.size > 32) cache.delete(cache.keys().next().value);
      return output;
    }

    function show(index) {
      if (index === current) return;
      art.innerHTML = markup(index);
      current = index;
    }

    function tick(now) {
      if (motion.matches) { show(data.posterFrame); return; }
      if (document.hidden) return;
      const elapsed = (now - origin) % data.loopDurationMs;
      let low = 0, high = ends.length - 1;
      while (low < high) {
        const mid = (low + high) >> 1;
        if (elapsed < ends[mid]) high = mid; else low = mid + 1;
      }
      show(low);
      timer = requestAnimationFrame(tick);
    }

    function sync() {
      cancelAnimationFrame(timer);
      if (motion.matches) { show(data.posterFrame); return; }
      if (!document.hidden) timer = requestAnimationFrame(tick);
    }

    // Largest font size that fits the whole canvas in both directions.
    function fit() {
      const probe = document.createElement("span");
      probe.style.cssText = 'position:absolute;visibility:hidden;font:700 100px Menlo,Consolas,"Liberation Mono",monospace';
      probe.textContent = "M";
      document.body.appendChild(probe);
      const ratio = probe.getBoundingClientRect().width / 100;
      probe.remove();
      const byWidth = (stage.clientWidth - 24) / (data.columns * ratio + 0.2);
      const byHeight = (stage.clientHeight - 16) / (data.rows * 1.25);
      art.style.fontSize = Math.max(4, Math.min(16, byWidth, byHeight)) + "px";
    }

    new ResizeObserver(fit).observe(stage);
    motion.addEventListener("change", sync);
    document.addEventListener("visibilitychange", sync);
    show(0);
    fit();
    sync();
  })();
</script>
</body>
</html>
