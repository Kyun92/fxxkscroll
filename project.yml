name: FxxkScroll
options:
  bundleIdPrefix: io.github.kyun92
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  FxxkScroll:
    type: application
    platform: macOS
    sources:
      - FxxkScroll
    info:
      path: FxxkScroll/Info.plist
      properties:
        CFBundleDisplayName: FxxkScroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: FxxkScroll reads the address of your browser tabs to block short-form video pages. It never sends them anywhere.
        CFBundleLocalizations: [en, ko]
    entitlements:
      path: FxxkScroll/FxxkScroll.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kyun92.FxxkScroll
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FxxkScrollTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FxxkScrollTests
    dependencies:
      - target: FxxkScroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kyun92.FxxkScrollTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FxxkScroll.app/Contents/MacOS/FxxkScroll
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  FxxkScroll:
    build:
      targets:
        FxxkScroll: all
    test:
      targets:
        - FxxkScrollTests
